version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: matchiq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/matchiq
      JWT_SECRET: change-me-secret
      JWT_EXPIRES_IN: 1h
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      - postgres

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - '3001:3001'
    depends_on:
      - backend

volumes:
  pg_data:
